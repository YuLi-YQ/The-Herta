name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml']
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install fixed dependencies
        run: |
          npm install --global pnpm@9.15.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm prepare:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm dist:personal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node packages/gui/scripts/check-personal-payload.mjs --unpacked packages/gui/release-round-21/win-unpacked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content packages/gui/package.json | ConvertFrom-Json).version
          if ($version -ne '0.8.10') { throw 'Review release workflow before changing version.' }
          $tag = "v$version-r30.1"
          $output = 'packages/gui/release-round-21'
          $files = @("$output/The-Herta-Setup-$version-x64.exe", "$output/The-Herta-$version-portable-x64.exe")
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file)) { throw "Missing package: $file" } }
          $checksums = foreach ($file in $files) { $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([IO.Path]::GetFileName($file))" }
          $checksumFile = "$output/SHA256SUMS.txt"
          $checksums | Set-Content -LiteralPath $checksumFile -Encoding utf8
          gh release view $tag --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; inspect it before publishing again.' }
          gh release create $tag --target $env:RELEASE_COMMIT --draft --title "The Herta $version · 聊天提示与审阅维护" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload $tag @files $checksumFile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

