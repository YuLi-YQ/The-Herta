<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- The Herta app mark (R75): an original geometric design, no character
       likeness. A tile with transparent corners, a gold orbit with one
       station on it, and the drawn-in spark the interface uses as its mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2439"/>
      <stop offset="1" stop-color="#16111C"/>
    </linearGradient>
    <linearGradient id="spark" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#EEDFFF"/>
      <stop offset="0.55" stop-color="#C3A3EF"/>
      <stop offset="1" stop-color="#9A74D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B48BEA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#B48BEA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#tile)"/>
  <rect x="13" y="13" width="230" height="230" rx="53" stroke="#CFB885" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="128" cy="128" r="70" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="72" stroke="#CFB885" stroke-width="3.5"/>
  <path d="M128 46c3.6 39.5 18.5 54.4 58 58-39.5 3.6-54.4 18.5-58 58-3.6-39.5-18.5-54.4-58-58 39.5-3.6 54.4-18.5 58-58Z" transform="translate(0 24)" fill="url(#spark)"/>
  <circle cx="179" cy="77" r="9" fill="#CFB885"/>
  <circle cx="179" cy="77" r="9" stroke="#16111C" stroke-opacity="0.5" stroke-width="2"/>
</svg>
